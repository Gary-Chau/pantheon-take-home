# @package _global_

# Models compared, all run 100% on CPU via Ollama (generation.num_gpu=0).
#
# Before running, pull each model once:
#   ollama pull llama3.2
#   ollama pull qwen3:4b
#   ollama pull mistral:7b
#
# Swap `tag` for a different size/variant (e.g. "llama3.1:8b", "qwen3:8b",
# "gemma2:9b") - just `ollama pull` whatever you put here first.

models:
  - tag: llama3.2
    family: Llama
    display_name: "Llama 3.2 (3B)"
  - tag: qwen3:4b
    family: Qwen
    display_name: "Qwen3 (4B)"
  - tag: mistral:7b
    family: Mistral
    display_name: "Mistral (7B)"
