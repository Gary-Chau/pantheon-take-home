trainer:
  _target_: pytorch_lightning.Trainer
  gpus: 0
  weights_summary: null
  progress_bar_refresh_rate: 5
  resume_from_checkpoint: null
  max_epochs: 30
  max_steps: -1
  fast_dev_run: true
model:
  _target_: src.models.cifar10_gan_model.CIFAR10GANModel
  lr: 0.0002
  b1: 0.5
  b2: 0.999
  n_classes: 10
  latent_dim: 100
  channels: 3
  img_size: 32
  generator:
    _target_: src.models.modules.cnn_generators.CNNGenerator
    n_classes: ${..n_classes}
    latent_dim: ${..latent_dim}
    channels: ${..channels}
    img_size: ${..img_size}
  discriminator:
    _target_: src.models.modules.cnn_discriminators.CNNDiscriminator
    n_classes: ${..n_classes}
    channels: ${..channels}
    img_size: ${..img_size}
datamodule:
  _target_: src.datamodules.cifar10_datamodule.CIFAR10DataModule
  data_dir: ${data_dir}
  train_val_test_split:
  - 50000
  - 5000
  - 5000
  batch_size: 64
  num_workers: 0
  pin_memory: false
  img_size: 32
callbacks:
  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: null
    dirpath: ckpts
    filename: '{epoch:03d}-{step:09d}'
    every_n_train_steps: 1720
    save_top_k: -1
    save_last: true
logger:
  csv:
    _target_: pytorch_lightning.loggers.csv_logs.CSVLogger
    save_dir: .
    name: csv/
    version: null
    prefix: ''
seed: 12345
work_dir: ${hydra:runtime.cwd}
data_dir: ${work_dir}/data/
debug: false
print_config: false
ignore_warnings: true
test_after_training: true
